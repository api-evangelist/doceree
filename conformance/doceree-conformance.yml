- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Doceree does return structured errors — CORRECTING the 2026-08-04 reading in
    this repo, which said there was no error envelope at all. There are in fact
    two, and neither is RFC 9457: an inline {errMessage, debugMessage} pair
    carried inside an HTTP 200 ad response, and a Spring-style
    {timestamp, status, error, path} body on dai.doceree.com. No
    application/problem+json content type and no `type` URI is used anywhere.
    See errors/doceree-problem-types.yml.
  source: errors/doceree-problem-types.yml
