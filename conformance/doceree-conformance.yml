standards:
- id: prebid-js-bid-adapter
  conforms: true
  version: Prebid.js module
  evidence: >-
    First-party bid adapter merged in the Prebid.js repository with bidder code
    `doceree`; documented at docs.prebid.org/dev-docs/bidders/doceree.html.
    Supported media type: banner. Prebid Server adapter: no.
  source: https://github.com/prebid/Prebid.js/blob/master/modules/docereeBidAdapter.js
- id: iab-europe-tcf
  conforms: true
  version: TCF (Transparency & Consent Framework)
  gvl_id: 1063
  evidence: >-
    Registered on the IAB Europe Global Vendor List as vendor 1063; the Prebid
    bidder page records "TCF-EU Support: Yes"; the adapter enforces presence of
    a gdpr_consent string when gdpr == 1.
  source: https://docs.prebid.org/dev-docs/bidders/doceree.html
- id: iab-mraid
  conforms: true
  version: '2.0'
  evidence: >-
    The open-source Doceree iOS SDK implements the IAB MRAID bridge
    (MRAIDConstants.swift declares MRAIDVersion = "2.0", with MRAID handler,
    delegate, utilities and browser window classes).
  source: https://github.com/doceree/ios-sdk/blob/master/DocereeAdsSdk/MRAIDConstants.swift
- id: iab-open-measurement-sdk
  conforms: true
  version: OMSDK (OMSDK_Doceree.xcframework)
  evidence: >-
    The current first-party iOS SDK vendors the IAB Tech Lab Open Measurement
    SDK as OMSDK_Doceree.xcframework (declared in DocereeAdSdk.podspec
    vendored_frameworks and linked via OTHER_LDFLAGS), with an OM integration
    layer in DocereeAdsSdk/OM/ (AdUnit.swift, OMIDSessionInteractor.swift).
    Added in SDK 6.0.0, released 2025-05-20 with the release note "OMSDK
    support".
  source: https://github.com/doceree/ios-sdk-new/blob/master/DocereeAdSdk.podspec
- id: iab-viewability-measurement
  conforms: true
  evidence: >-
    "Doceree has fully implemented the industry-standard IAB (Interactive
    Advertising Bureau) guidelines for measuring display ad viewability."
    Doceree also states it supports custom viewability thresholds and integrates
    with DoubleVerify and Integral Ad Science (IAS), purchasable through its
    Marketplace at campaign setup. The ad response carries minViewPercentage and
    minViewTime members that drive client-side viewability timing.
  source: https://support.doceree.com/hc/en-us/articles/7288505026967-What-are-the-viewability-metrics-available-on-the-Doceree-platform
- id: iab-gpp
  conforms: true
  evidence: >-
    The SDK consent model accepts GPP section IDs alongside TCF
    (DocereeConsentBuilder.setPrivacySid("2,6"), ConsentPayloadKey.pcysid) and
    falls back to reading IAB TCF/GPP keys from UserDefaults when no consent has
    been set. Privacy consent integration shipped in SDK 6.2.0 (2025-09-29).
  source: https://github.com/doceree/ios-sdk-new/blob/master/iOS_SDK_Implementation.md
- id: ketch-cmp
  conforms: true
  evidence: >-
    The iOS SDK takes a hard dependency on KetchSDK 4.0.3 and ships a consent
    management UI layer (DocereeAdsSdk/View/KetchView/). Consent capture is
    delegated to a third-party CMP rather than hand-rolled.
  source: https://github.com/doceree/ios-sdk-new/blob/master/DocereeAdSdk.podspec
- id: iab-tech-lab
  conforms: true
  evidence: IAB Tech Lab badge published in the compliance row on doceree.com.
