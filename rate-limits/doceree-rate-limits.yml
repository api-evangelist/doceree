gaps:
- No published rate limit, quota or burst allowance for any endpoint.
- No RateLimit-* / X-RateLimit-* / Retry-After header on any response.
- No documented 429 behaviour, so a client cannot distinguish throttling from an
  outage.
- 'A real IP-based throttle exists but is undocumented and is returned as HTTP
  200 — the worst of both worlds: enforced, but invisible to standard client
  tooling.'
