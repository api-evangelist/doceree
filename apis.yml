x-notes:
  well-known: >-
    well-known/doceree-well-known.yml is retained as a recorded probe, but the
    `type: WellKnown` pointer was REMOVED on 2026-08-12. The probe records
    documents_found: 0 — every /.well-known/ path 404s or 403s on every Doceree
    host, and the 200s on exchange.doceree.com are an Angular SPA catch-all
    serving HTML, not documents. A pointer would have asserted that Doceree
    serves a well-known surface, which it does not.
