apis:
- aid: doceree:bidder
  name: Doceree Bidder / Ad Request API
  description: 'The ad-request surface Doceree publisher partners call to fetch an
    HCP-targeted advertisement. It is the endpoint behind the Doceree Publisher Tag,
    the first-party Prebid.js header-bidding adapter (bidder code "doceree") and the
    Doceree iOS/Android ad SDKs. GET /v1/adrequest returns a JSON ad payload
    (sourceHTML, width, height, cpmBid, currency, advertiserDomain, DIVID, guid);
    additional documented paths cover identity initialization (/v1/doceree-init,
    /v1/init, /v1/initliveintent), point-of-care and DMD data capture
    (/v1/savePOCdata, /v1/saveDMDInfo), ad-block feedback (/saveadblockinfo) and
    client log shipping (/render/logMessage). No OpenAPI is published; the surface
    below is recorded from Doceree''s own public client code.'
  humanURL: https://doceree.com/publishers
  baseURL: https://bidder.doceree.com
  tags:
  - Advertising
  - Header Bidding
  - Programmatic
  - Healthcare
  properties:
  - type: APIReference
    url: https://docs.prebid.org/dev-docs/bidders/doceree.html
  - type: SourceCode
    url: https://github.com/prebid/Prebid.js/blob/master/modules/docereeBidAdapter.js
  - type: Conventions
    url: conventions/doceree-conventions.yml
  - type: Authentication
    url: authentication/doceree-authentication.yml
- aid: doceree:tracking
  name: Doceree Tracking API
  description: 'Doceree''s measurement and beacon endpoint. The Prebid.js adapter
    fires GET /v1/hbTimeout and GET /v1/hbBidWon with a base64-encoded, URI-encoded
    JSON payload on the `data` query parameter and an `adp` adapter identifier;
    impression and click beacons returned inside an ad response are also served from
    this host. No OpenAPI is published; the surface is recorded from Doceree''s own
    public Prebid.js adapter and iOS SDK source.'
  humanURL: https://doceree.com/publishers
  baseURL: https://tracking.doceree.com
  tags:
  - Advertising
  - Analytics
  - Tracking
  properties:
  - type: SourceCode
    url: https://github.com/prebid/Prebid.js/blob/master/modules/docereeBidAdapter.js
