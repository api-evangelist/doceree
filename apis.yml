aid: doceree
name: Doceree
description: 'Doceree Inc. is a US healthcare marketing technology company (Short Hills,
  New Jersey) operating a global network of physician-only platforms for programmatic
  messaging and point-of-care advertising to healthcare professionals. Its platform
  spans HCP programmatic, point-of-care, EHR, email, SMS, co-pay/affordability and
  account-based messaging channels, backed by a proprietary HCP identity-resolution
  graph. Doceree''s public, machine-readable surface is an advertising-technology
  one rather than a general-purpose developer API: a versioned ad-request/bidder
  endpoint (bidder.doceree.com/v1/adrequest), a tracking/beacon endpoint
  (tracking.doceree.com), a hosted publisher tag (the Doceree Publisher Tag,
  servedbydoceree.doceree.com/script/render-header.js), a first-party Prebid.js
  header-bidding adapter (bidder code "doceree", IAB Europe GVL ID 1063), and
  first-party mobile ad SDKs for iOS (CocoaPods) and Android (JitPack). A second,
  newer ad-serving generation runs concurrently on dai.doceree.com (POST /drs/*
  and /dop/*, unversioned) and is used by the iOS SDK 6.x; it carries clinical
  session, patient, prescription and action-event attributes onto the ad request
  itself. Doceree publishes no OpenAPI, AsyncAPI, GraphQL schema, MCP server or
  A2A agent card at any probed host as of August 2026, and no /.well-known/
  document on any host.'
