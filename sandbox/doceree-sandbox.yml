notable:
  healthcare_intake_has_no_production_host: >-
    HealthcareIntakeEndpoint.swift hardcodes a single URL —
    https://qa-healthcare.doceree.com/v1/intake — with no environment switch at
    all. The shipped 6.x SDK therefore points its healthcare-intake call at a QA
    host in every build. healthcare.doceree.com returns 404, so no production
    equivalent is published.
  default_environment: >-
    DocereeMobileAds holds `private var environmentType = EnvironmentType.Prod`,
    so an integrator who never calls `setEnvironment(type:)` gets production.
    The free helper functions getHost(type:) and getPath(methodName:type:) carry
    a `.Dev` parameter default, but every call site passes the SDK's stored
    environment, so that default is not reachable in normal use.
