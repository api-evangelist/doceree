note: >-
  Doceree publishes NO named subscription tiers and no /pricing page
  (https://doceree.com/pricing returns HTTP 404, and no pricing entry exists in
  https://doceree.com/sitemap.xml). It is an advertising marketplace, not a
  metered API product: buyers fund media spend and Doceree takes a percentage
  service fee on top. What IS published — and recorded below — is the fee
  structure, the bidding/pricing models, and the billing mechanics, read from
  Doceree's own public Zendesk help center. There is no per-request, per-seat or
  per-API-call price list of any kind, so plan_count is honestly 0.
pricing_model: percentage-of-media-spend + auction bidding
