access_model:
  self_service: partial
  note: >-
    Doceree describes the platform as available both managed and self-service
    (support article "Is the platform managed or self-service?"), but account
    creation, the Exchange dashboard (https://exchange.doceree.com/login) and
    the publisher ad-serving credentials (placementId / appKey) are all issued
    behind account signup. There is no public self-serve signup price, no free
    tier, and no trial published.
gaps:
- No /pricing page and no plan tiers of any kind on doceree.com.
- No published CPM/CPS floor prices, rate card, or minimum spend.
- No API-call pricing — the ad-serving endpoints are not sold as an API product.
- Cancellation policy exists as a help-center article but states no numbers.
