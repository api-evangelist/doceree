service_fees:
- name: Tech Access Fee
  rate: 10%
  basis: media spend
  description: >-
    Charged for the technological set up and for running and implementation of
    programmatic activities.
  source: https://support.doceree.com/hc/en-us/articles/9082052137239-How-much-service-fee-does-Doceree-charge
- name: Managed Services Fee
  rate: 10%
  basis: media spend
  description: >-
    Charged to have Doceree AdOps experts and the Customer Success team manage
    campaign set up and campaign optimization. Doceree requires that any pilot
    project be run as a managed service.
  source: https://support.doceree.com/hc/en-us/articles/9082052137239-How-much-service-fee-does-Doceree-charge
bidding_models:
- id: CPM
  name: Cost per Mille (cost per thousand impressions)
  charged_on: impressions served
  use_case: campaigns optimizing for visibility
- id: CPS
  name: Cost per Session
  charged_on: EHR workflow sessions selected at campaign creation
  workflows: [patient intake, diagnosis test ordering, diagnosis test review,
    medical review, e-prescription (eRx)]
  use_case: point-of-care / EHR campaigns
- id: programmatic
  name: Programmatic bidding
  charged_on: >-
    Doceree's bidding algorithm optimizes the bid in real time against a
    daily/weekly spend limit and a target CPM or CPS goal.
  controls: [daily spend limit, weekly spend limit, adjustable at any time]
  source: https://support.doceree.com/hc/en-us/articles/9083813535127-What-are-the-bidding-strategies-for-Programmatic-Ad-pricing-models
billing:
  cycle: monthly
  interim_invoice_threshold:
    amount: 500
    currency: USD
    note: >-
      "Billing happens for every brand at the end of every month or an
      additional bill is generated if the campaign spends exceed $500 before the
      end of the month."
  payment_methods:
  - id: credit-card
    detail: >-
      All major international credit cards; deducted automatically at the end of
      every month based on expenditure. Card details are stored and processed
      via Authorize.net. One card can be associated with multiple brands.
  - id: monthly-invoicing
    detail: >-
      Not enabled by default. Applied for from the monthly invoicing tab
      ("+Apply new"); once enabled, Doceree raises an invoice at month end and
      the buyer wires payment before the stated due date.
  - id: credit-line
    detail: >-
      Offered to selected brands and media agencies at Doceree's discretion,
      based on payment history and other factors.
  prerequisite: >-
    At least one payment method must be registered on the Doceree platform
    before a campaign can start.
  source: https://support.doceree.com/hc/en-us/articles/9082098474903-What-is-the-billing-process-for-brands-and-media-agencies
delivery_controls:
  frequency_capping:
    supported: true
    granularity: [per day, per week, per month]
    description: >-
