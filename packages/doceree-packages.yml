  general-purpose API SDK. Registries re-probed 2026-08-12: CocoaPods trunk
  (hit), GitHub org github.com/doceree (hit), npm (one employee-published
  package, not clearly first-party), PyPI 404, RubyGems 404, Packagist 404,
  crates.io 403 to anonymous, Maven Central 0 results for "doceree", JitPack
  (com.github.doceree 404 to anonymous API queries). Currency finding: every
  first-party Doceree client last shipped in 2025 — the newest published release
  on any registry is 2025-10-10, ten months before this probe — while the source
  repository has moved on to an unpublished 6.3.0.
